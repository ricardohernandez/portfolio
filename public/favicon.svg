<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" fill="url(#grad)" rx="20"/>
  
  <!-- Portfolio icon - stylized laptop/window -->
  <g fill="white">
    <!-- Outer frame -->
    <rect x="15" y="25" width="70" height="50" rx="3" fill="none" stroke="white" stroke-width="3"/>
    
    <!-- Top bar -->
    <rect x="15" y="25" width="70" height="8" rx="2" fill="white"/>
    
    <!-- Window circles -->
    <circle cx="22" cy="29" r="1.5" fill="url(#grad)"/>
    <circle cx="30" cy="29" r="1.5" fill="url(#grad)"/>
    <circle cx="38" cy="29" r="1.5" fill="url(#grad)"/>
    
    <!-- Content area lines -->
    <line x1="20" y1="40" x2="80" y2="40" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="48" x2="60" y2="48" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="56" x2="75" y2="56" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="64" x2="55" y2="64" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>